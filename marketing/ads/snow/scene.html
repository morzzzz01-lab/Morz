<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Snowflake projector v2: creator-style edit built only from the store's real photos.
     Keyframed virtual camera per shot (focus point fx/fy in the photo, scale s, roll r), speed-ramp easings,
     beat punches, handheld shake, hard cuts on the beat (120 BPM). No synthetic snow, no fake room. -->
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:'Inter Display',Inter,'Noto Color Emoji',sans-serif}
  .shot{position:absolute;inset:0;overflow:hidden;visibility:hidden}
  .img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .dark{position:absolute;inset:0;background:radial-gradient(1000px 1100px at 50% 45%,#22344f 0%,#0e1828 55%,#05080e 100%)}
  .light{position:absolute;inset:0;background:radial-gradient(1100px 1200px at 50% 42%,#ffffff 0%,#eef3f9 55%,#dbe4ef 100%)}
  .shadow{position:absolute;left:50%;width:700px;height:90px;margin-left:-350px;border-radius:50%;
          background:radial-gradient(ellipse,rgba(20,30,50,.35),rgba(20,30,50,0) 70%)}
  .glow{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none;
        background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(220,235,255,.18) 35%,rgba(220,235,255,0) 70%)}
  .sweep{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light}
  /* TikTok-native caption: white bold text on a rounded dark box */
  .cap{position:absolute;left:0;right:0;text-align:center;opacity:0}
  .cap span{display:inline;background:rgba(10,12,18,.82);color:#fff;font-weight:800;font-size:74px;line-height:1.42;
            padding:.08em .34em;border-radius:20px;-webkit-box-decoration-break:clone;box-decoration-break:clone;letter-spacing:.005em}
  #price{position:absolute;left:0;right:0;top:1215px;text-align:center;font-weight:900;font-size:200px;letter-spacing:-.035em;color:#0c1626;opacity:0;line-height:1}
  #name{position:absolute;left:0;right:0;top:1150px;text-align:center;font-weight:600;font-size:40px;letter-spacing:.22em;color:#5b6b82;opacity:0;text-transform:uppercase}
  #shop{position:absolute;left:50%;top:1460px;transform:translateX(-50%);background:#0c1626;color:#fff;font-weight:800;font-size:66px;
        padding:30px 88px;border-radius:999px;opacity:0;white-space:nowrap;letter-spacing:.04em}
  #url{position:absolute;left:0;right:0;top:1615px;text-align:center;color:#5b6b82;font-weight:700;font-size:42px;letter-spacing:.1em;opacity:0}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head>
<body>
<div id="shots"></div>
<div id="caps"></div>
<div id="name">Snowflake Projector Lamp</div>
<div id="price">$25.99</div>
<div id="shop">SHOP NOW</div>
<div id="url">morz.lol</div>
<div id="flash"></div>
<script>
const C=window.CONFIG, I=C.images, $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,x)=>a+(b-a)*x;
const EASE={
  lin:x=>x,
  out:x=>1-Math.pow(1-x,4),                                   // fast start, glide (speed ramp down)
  in:x=>x*x*x,                                                // accelerate into the cut
  ramp:x=>x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2, // slow-FAST-slow speed ramp
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
};
const back=(x,c=2.2)=>{x=clamp(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const DUR=15; window.DURATION=DUR;

// ---------- shots ----------
// k: keyframes [time, fx, fy, s, rollDeg, ease-into-this-key]; fx/fy = point of the photo held at screen centre
// cover: clamp so the photo always fills the frame; punch: beat times for a quick punch-in; shake: handheld amount
const S=[
 {id:'hook', img:'room', w:2000,h:1372, a:0.0, b:2.0, cover:1, shake:1, punch:[1.0,1.5],
  k:[[0.0,.640,.270,3.30,-2.0],[0.50,.630,.285,3.05,-1.0,'lin'],[0.95,.520,.500,1.55,0,'out'],[2.0,.470,.500,1.62,1.2,'lin']]},
 {id:'tree', img:'tree', w:2000,h:1340, a:2.0, b:3.0, cover:1, shake:1, punch:[2.0,2.5],
  k:[[2.0,.240,.400,2.00,0],[3.0,.215,.400,2.25,-1.5,'lin']]},
 {id:'detail', img:'room', w:2000,h:1372, a:3.0, b:4.0, cover:1, shake:1, punch:[3.0],
  k:[[3.0,.440,.570,2.40,-2],[3.42,.445,.565,2.28,-1,'lin'],[3.66,.190,.420,2.20,1,'ramp'],[4.0,.190,.420,2.08,2,'lin']]},
 {id:'lamp', img:'tree', w:2000,h:1340, a:4.0, b:5.0, cover:1, shake:.8, punch:[4.0],
  k:[[4.0,.420,.460,1.60,0],[4.55,.500,.455,1.62,0,'lin'],[5.0,.605,.449,1.95,0,'in']]},
 // match cut: lens ring of the cut-out lands exactly where the lens ring was in the previous shot (radius ~520px)
 {id:'hero', img:'hero', w:2000,h:2000, a:5.0, b:6.25, bg:'dark', shake:.45, glow:1,
  punch:[5.75],
  k:[[5.0,.300,.320,1.265,0],[5.5,.470,.470,.56,-3,'out'],[6.25,.440,.440,.66,3,'lin']]},
 {id:'side', img:'side', w:2000,h:2000, a:6.25, b:7.0, bg:'dark', shake:.45, punch:[6.25],
  k:[[6.25,.640,.460,.78,2],[7.0,.470,.500,.60,-1,'out']]},
 {id:'front', img:'front', w:2000,h:2000, a:7.0, b:8.0, bg:'dark', shake:.45, punch:[7.0],
  k:[[7.0,.540,.500,.62,0],[7.49,.580,.460,.70,1,'lin'],[7.5,.700,.310,1.40,0,'cut'],[8.0,.700,.310,1.56,-1,'lin']]},
 {id:'beam', img:'tree', w:2000,h:1340, a:8.0, b:9.5, cover:1, shake:1, punch:[8.0],
  k:[[8.0,.560,.470,2.30,0],[8.35,.545,.465,2.30,0,'lin'],[9.05,.230,.410,2.10,-1,'ramp'],[9.5,.220,.400,2.18,-2,'lin']]},
 {id:'cozy', img:'room', w:2000,h:1372, a:9.5, b:11.0, cover:1, shake:1, punch:[9.5,10.25],
  k:[[9.5,.300,.550,1.75,0],[10.24,.330,.550,1.86,1,'lin'],[10.25,.740,.640,1.80,0,'cut'],[11.0,.705,.630,1.95,1.5,'lin']]},
 {id:'end', img:'hero', w:2000,h:2000, a:11.0, b:99, bg:'light', shake:.15, glow:1, end:1,
  punch:[11.25,12.5,13.5,14.5],
  k:[[11.0,.500,.812,.40,-4],[11.45,.500,.764,.47,0,'out'],[13.2,.490,.752,.49,2,'io'],[15.0,.505,.745,.515,-1.5,'io']]},
];
const host=$('shots');
S.forEach((s,i)=>{
  host.insertAdjacentHTML('beforeend',`<div class="shot" id="s${i}">
    ${s.bg?`<div class="${s.bg}"></div>`:''}${s.end?'<div class="shadow" id="shd" style="top:1080px"></div>':''}
    <img class="img" id="im${i}" src="${I[s.img].img}" style="width:${s.w}px;height:${s.h}px">
    ${s.glow?`<div class="glow" id="gl${i}"></div>`:''}${s.end?'<canvas class="sweep" id="sw" width="1080" height="1920"></canvas>':''}</div>`);});

// ---------- captions (each line appears once) ----------
const CAPS=[
 ['YOUR CEILING COULD<br>LOOK LIKE THIS?!',250,0.0,2.0],
 ['LOOK AT THAT.',270,2.0,5.0],
 ['THIS LITTLE PROJECTOR<br>DOES THAT.',250,5.0,8.0],
 ['INSTANT CHRISTMAS<br>ATMOSPHERE.',250,8.0,11.0],
];
$('caps').innerHTML=CAPS.map((c,i)=>`<div class="cap" id="c${i}" style="top:${c[1]}px"><span>${c[0]}</span></div>`).join('');

// ---------- camera ----------
function cam(s,t){const k=s.k;let j=0;while(j<k.length-1&&t>=k[j+1][0])j++;
  if(j>=k.length-1)return k[k.length-1].slice(1,5);
  const A=k[j],B=k[j+1],e=B[5]||'io';if(e==='cut')return A.slice(1,5);
  const p=EASE[e](clamp((t-A[0])/(B[0]-A[0])));return [1,2,3,4].map(n=>lerp(A[n],B[n],p));}
function shake(t,a){return [a*(7*Math.sin(t*5.1)+4*Math.sin(t*8.3+1.3)+2*Math.sin(t*13.7+.4)),
                            a*(6*Math.sin(t*4.3+2.1)+4*Math.sin(t*9.1+.2)+2*Math.sin(t*15.2+2.2)),
                            a*(.35*Math.sin(t*3.7+.7)+.2*Math.sin(t*7.9))];}
function punchAmt(s,t){let m=1;for(const b of (s.punch||[])){const d=t-b;if(d>=0&&d<.45)m*=1+.085*Math.exp(-d*9);}return m;}

window.render=function(t){
  S.forEach((s,i)=>{const el=$('s'+i),on=t>=s.a&&t<s.b;el.style.visibility=on?'visible':'hidden';if(!on)return;
    let [fx,fy,sc,r]=cam(s,t); sc*=punchAmt(s,t);
    if(s.cover){ // keep the photo covering the frame (rotation margin included)
      const m=1+Math.abs(r)*.02; sc=Math.max(sc,1920*m/s.h,1080*m/s.w);
      const hw=540*m/(s.w*sc), hh=960*m/(s.h*sc); fx=clamp(fx,hw,1-hw); fy=clamp(fy,hh,1-hh);}
    const [dx,dy,dr]=shake(t,s.shake||0);
    const im=$('im'+i), ox=fx*s.w, oy=fy*s.h;
    im.style.transformOrigin=`${ox}px ${oy}px`;
    im.style.transform=`translate(${540-ox+dx}px,${960-oy+dy}px) rotate(${r+dr}deg) scale(${sc})`;
    if(s.glow){const g=$('gl'+i); // the lamp's own white light, centred on the lens
      const lx=540+(.300-fx)*s.w*sc+dx, ly=960+(.320-fy)*s.h*sc+dy, R=s.w*sc*.30*(1+.04*Math.sin(t*6));
      g.style.left=(lx-R)+'px';g.style.top=(ly-R)+'px';g.style.width=g.style.height=(2*R)+'px';
      g.style.opacity=s.end?.45:(.5-.15*clamp((t-s.a)/.6));}
    if(s.end){const q=t-s.a;
      $('shd').style.transform=`scale(${sc/.5})`;$('shd').style.top=(960+(.89-fy)*s.h*sc-45+dy)+'px';
      const cv=$('sw'),g=cv.getContext('2d');g.clearRect(0,0,1080,1920);const x=lerp(-500,1600,clamp((q-1.0)/1.2));
      if(q>1.0&&q<2.2){const gr=g.createLinearGradient(x-220,0,x+220,400);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,1080,1920);}}
  });
  CAPS.forEach((c,i)=>{const el=$('c'+i),on=t>=c[2]&&t<c[3];el.style.opacity=on?1:0;if(!on)return;
    const l=t-c[2]; el.style.transform=`scale(${i===0?Math.min(1,.94+l*.6):back(l/.16,1.6)})`;});
  const q=t-11.0;
  $('name').style.opacity=clamp((q-.15)/.2);
  $('price').style.opacity=q>.25?1:0; $('price').style.transform=`scale(${back((q-.25)/.25,2.4)})`;
  $('shop').style.opacity=q>.75?1:0; $('shop').style.transform=`translateX(-50%) scale(${back((q-.75)/.25)*(1+.035*Math.max(0,Math.sin((q-1)*Math.PI*2)))})`;
  $('url').style.opacity=clamp((q-1.0)/.2);
  let fl=0;{const d=t-5.0;if(d>=0&&d<.08)fl=.3*(1-d/.08);} $('flash').style.opacity=fl;
};
</script>
</body></html>
