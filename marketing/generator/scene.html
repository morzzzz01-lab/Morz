<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Data-driven reel template. render.js injects window.CONFIG (see config.example.json) then calls render(t). -->
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
  #bg{position:absolute;inset:0}
  #glow{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%}
  canvas{position:absolute;inset:0}
  .layer{position:absolute;inset:0;opacity:0}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 60px}
  .logo{width:300px}
  .kicker{font-weight:800;letter-spacing:.3em;font-size:40px;text-transform:uppercase}
  .big{font-family:'Inter Display',Inter;font-weight:900;font-size:140px;line-height:.98;letter-spacing:-.02em}
  .prod img{position:absolute;left:50%;top:300px;width:820px;height:820px;margin-left:-410px;object-fit:contain;
            filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
  .badge{position:absolute;right:90px;top:250px;width:230px;height:230px;border-radius:50%;color:#fff;
         display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;
         box-shadow:0 20px 40px rgba(0,0,0,.4)}
  .badge b{font-size:84px;line-height:1}.badge span{font-size:36px;letter-spacing:.1em}
  .info{position:absolute;left:0;right:0;top:1170px;text-align:center;padding:0 70px}
  .name{font-family:'Inter Display',Inter;font-weight:800;font-size:76px;line-height:1.05}
  .price{margin-top:34px;font-size:110px;font-weight:900}
  .price s{font-size:60px;font-weight:600;margin-left:24px;vertical-align:middle;opacity:.6}
  .btn{margin-top:70px;font-weight:900;font-size:64px;padding:34px 80px;border-radius:999px}
  .url{margin-top:44px;font-size:56px;font-weight:700;letter-spacing:.04em}
  #bar{position:absolute;left:0;bottom:0;height:12px}
</style></head>
<body>
<div id="bg"></div><div id="glow"></div>
<canvas id="fx" width="1080" height="1920"></canvas>
<div id="root"></div>
<div id="bar"></div>
<script>
const THEMES={
  night:{bg:'radial-gradient(1200px 1100px at 50% 45%,#14301f 0%,#071009 55%,#000 100%)',ink:'#f4f6fa',muted:'#98a2b3',accent:'#ffd24a',hot:'#e63946',alt:'#1fae5b',glow:'rgba(255,210,74,.28)',flake:'#fff',logo:'morz-logo.png'},
  snow: {bg:'linear-gradient(180deg,#ffffff 0%,#eef4fb 60%,#dfe9f5 100%)',ink:'#111',muted:'#5b6574',accent:'#e63946',hot:'#e63946',alt:'#1fae5b',glow:'rgba(57,168,255,.18)',flake:'#9cc7ef',logo:'morz-logo-dark.png'},
  candy:{bg:'radial-gradient(1200px 1100px at 50% 40%,#c8102e 0%,#8a0b1f 60%,#4a0410 100%)',ink:'#fff',muted:'#ffd0d6',accent:'#ffd24a',hot:'#1fae5b',alt:'#ffd24a',glow:'rgba(255,255,255,.22)',flake:'#fff',logo:'morz-logo.png'},
  midnight:{bg:'radial-gradient(1200px 1100px at 50% 45%,#13234a 0%,#070d1f 60%,#000 100%)',ink:'#f4f6fa',muted:'#98a2b3',accent:'#39a8ff',hot:'#ff3b30',alt:'#ffd24a',glow:'rgba(57,168,255,.3)',flake:'#cfe6ff',logo:'morz-logo.png'},
};
const C=window.CONFIG, T=THEMES[C.theme]||THEMES.night;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur=C.currency||'$';
document.body.style.background='#000';
document.getElementById('bg').style.background=T.bg;
document.getElementById('glow').style.background=`radial-gradient(circle,${T.glow},transparent 65%)`;
document.getElementById('bar').style.background=`linear-gradient(90deg,${T.hot},${T.accent},${T.alt})`;
document.body.style.color=T.ink;

// headline: words wrapped in *stars* get the hot colour, _underscores_ get the alt colour
const fmt=s=>esc(s).replace(/\*(.+?)\*/g,`<span style="color:${T.hot}">$1</span>`).replace(/_(.+?)_/g,`<span style="color:${T.alt}">$1</span>`).replace(/\n/g,'<br>');
const root=document.getElementById('root');
root.insertAdjacentHTML('beforeend',`<div class="layer center" id="s0">
  <img class="logo" src="${T.logo}">
  <div class="kicker" style="margin-top:70px;color:${T.accent}">${esc(C.kicker)}</div>
  <div class="big" style="margin-top:30px">${fmt(C.headline)}</div></div>`);
C.products.forEach((p,i)=>{
  const off=p.was?Math.round((1-p.now/p.was)*100):0;
  root.insertAdjacentHTML('beforeend',`<div class="layer prod" id="p${i}">
    <img src="${p.img}">
    ${off>0?`<div class="badge" style="background:${T.hot}"><b>-${off}%</b><span>${esc(C.offWord||'OFF')}</span></div>`:''}
    <div class="info"><div class="name">${esc(p.name)}</div>
    <div class="price" style="color:${T.accent}">${cur}${p.now}${p.was?`<s style="color:${T.muted}">${cur}${p.was}</s>`:''}</div></div></div>`);
});
root.insertAdjacentHTML('beforeend',`<div class="layer center" id="s9">
  <img class="logo" src="${T.logo}" style="width:220px">
  <div class="big" style="margin-top:60px;font-size:124px">${fmt(C.outroHeadline)}</div>
  <div class="kicker" style="margin-top:40px;letter-spacing:.16em">${esc(C.outroSub||'')}</div>
  <div class="btn" style="background:${T.accent};color:${C.theme==='snow'?'#fff':'#111'}">${esc(C.cta)}</div>
  <div class="url">${esc(C.url)}</div></div>`);

const N=C.products.length, INTRO=2.5, OUTRO=2.5, SEG=C.segment||2.5, DUR=INTRO+SEG*N+OUTRO, OUTRO_AT=INTRO+SEG*N;
window.DURATION=DUR;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fade=(t,a,b,f=.3)=>clamp((t-a)/f)*clamp((b-t)/f);

let seed=(C.seed||7)%2147483646+1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const fxKind=C.fx||'snow';
const parts=[...Array(fxKind==='sparkle'?90:160)].map(()=>({x:rnd()*1080,y:rnd()*1920,r:2+rnd()*6,v:60+rnd()*140,w:rnd()*6.28,a:.3+rnd()*.6}));
const ctx=document.getElementById('fx').getContext('2d');
// entrance style per product: slide, zoom, drop
const ENTER=C.motion||'slide';

window.render=function(t){
  ctx.clearRect(0,0,1080,1920);
  for(const f of parts){
    if(fxKind==='sparkle'){
      const a=f.a*(.5+.5*Math.sin(t*3+f.w*5));ctx.globalAlpha=a;ctx.fillStyle=T.accent;
      const s=f.r*1.6;ctx.beginPath();ctx.moveTo(f.x,f.y-s);ctx.lineTo(f.x+s/4,f.y);ctx.lineTo(f.x,f.y+s);ctx.lineTo(f.x-s/4,f.y);ctx.fill();
      ctx.beginPath();ctx.moveTo(f.x-s,f.y);ctx.lineTo(f.x,f.y+s/4);ctx.lineTo(f.x+s,f.y);ctx.lineTo(f.x,f.y-s/4);ctx.fill();
    } else {
      const y=(f.y+f.v*t)%1960-20, x=f.x+Math.sin(t*1.3+f.w)*30;
      ctx.globalAlpha=f.a;ctx.fillStyle=T.flake;ctx.beginPath();ctx.arc(x,y,f.r,0,6.283);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  document.getElementById('glow').style.transform=`scale(${1+.06*Math.sin(t*3)})`;

  const s0=document.getElementById('s0');
  s0.style.opacity=fade(t,-1,INTRO,.4);
  s0.style.transform=`scale(${.9+.1*eo(t/.8)})`;

  C.products.forEach((p,i)=>{
    const a=INTRO+i*SEG, b=a+SEG, lt=t-a, el=document.getElementById('p'+i);
    el.style.opacity=fade(t,a,b,.25);
    const img=el.querySelector('img'), badge=el.querySelector('.badge'), info=el.querySelector('.info');
    const dir=i%2?-1:1, k=1-eo(lt/.6);
    if(ENTER==='zoom') img.style.transform=`scale(${.4+.6*eo(lt/.6)+.03*lt}) rotate(${k*dir*20}deg)`;
    else if(ENTER==='drop') img.style.transform=`translateY(${-900*(1-back(lt/.7))}px) scale(${1+.03*lt})`;
    else img.style.transform=`translateX(${dir*k*500}px) scale(${.85+.15*eo(lt/.6)+.03*lt}) rotate(${dir*k*-12}deg)`;
    if(badge) badge.style.transform=`scale(${back((lt-.35)/.45)}) rotate(${-15+5*Math.sin(t*4)}deg)`;
    info.style.transform=`translateY(${(1-eo((lt-.2)/.5))*120}px)`;
    info.style.opacity=clamp((lt-.2)/.35);
  });

  const s9=document.getElementById('s9'), lt=t-OUTRO_AT;
  s9.style.opacity=clamp(lt/.35);
  s9.style.transform=`scale(${.92+.08*eo(lt/.6)})`;
  s9.querySelector('.btn').style.transform=`scale(${1+.05*Math.sin(lt*7)*clamp(lt-.5)})`;
  document.getElementById('bar').style.width=(t/DUR*1080)+'px';
};
</script>
</body></html>
