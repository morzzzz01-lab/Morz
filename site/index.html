<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MORZ — morz.lol</title>
<meta name="description" content="MORZ — mini website. Fresh kicks, good vibes.">
<link rel="icon" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#000;--panel:#0c0f14;--line:#1d2530;--ink:#f4f6fa;--muted:#98a2b3;--blue:#2d8cff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Manrope","Helvetica Neue",Arial,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
nav img{height:44px}
nav a.l{color:var(--muted);margin-left:20px}nav a.l:hover{color:var(--ink)}
.hero{text-align:center;padding:70px 0 60px}
.hero img{width:150px;filter:drop-shadow(0 0 30px rgba(45,140,255,.45))}
h1{font-size:clamp(40px,9vw,84px);letter-spacing:.06em;margin:18px 0 8px}
.hero p{color:var(--muted);font-size:18px;max-width:480px;margin:0 auto 28px}
.btn{display:inline-block;background:var(--blue);color:#fff;padding:13px 30px;border-radius:999px;font-weight:700;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(45,140,255,.4)}
h2{text-align:center;font-size:28px;margin:30px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s}
.card:hover{border-color:var(--blue);transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card div{padding:14px 16px;color:var(--muted)}
.about{text-align:center;color:var(--muted);max-width:560px;margin:60px auto}
footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <img src="morz-logo.png" alt="MORZ">
    <div><a class="l" href="#shop">Shop</a><a class="l" href="#about">About</a><a class="l" href="#contact">Contact</a></div>
  </nav>
  <header class="hero">
    <img src="morz-logo.png" alt="">
    <h1>MORZ</h1>
    <p>Fresh kicks, good vibes. Welcome to morz.lol.</p>
    <a class="btn" href="#shop">See the drop</a>
  </header>
  <section id="shop">
    <h2>Latest</h2>
    <div class="grid">
      <a class="card" href="#"><img src="shoe-1.webp" alt="Shoe 1"><div>Morz Classic</div></a>
      <a class="card" href="#"><img src="shoe-2.webp" alt="Shoe 2"><div>Morz Runner</div></a>
      <a class="card" href="#"><img src="shoe-3.webp" alt="Shoe 3"><div>Morz Street</div></a>
    </div>
  </section>
  <section id="about" class="about">
    <h2>About</h2>
    <p>MORZ is a small brand with big energy. Quality, comfort and style, made simple.</p>
  </section>
</div>
<footer id="contact">© 2026 MORZ · morz.lol</footer>
</body>
</html>
